<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shebidan Productions - Gallery</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 0; }
  header { text-align: center; padding: 40px 20px; background: #000; }
  header h1 { font-size: 2.5em; letter-spacing: 2px; margin: 0; }
  header p { color: #aaa; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 30px; }
  .gallery img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; transition: transform 0.3s; }
  .gallery img:hover { transform: scale(1.05); }
  footer { text-align: center; padding: 20px; color: #777; }
</style>
</head>
<body>
  <header>
    <h1>Shebidan Productions</h1>
    <p>Gallery and Artworks</p>
  </header>
  <section class="gallery">
    <img src="artwork1.jpg" alt="Artwork 1">
    <img src="artwork2.jpg" alt="Artwork 2">
    <img src="artwork3.jpg" alt="Artwork 3">
    <img src="artwork4.jpg" alt="Artwork 4">
  </section>
  <footer>
    <p>&copy; 2026 Shebidan Productions. All rights reserved.</p>
  </footer>
</body>
</html>
